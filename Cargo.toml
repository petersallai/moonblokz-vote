[package]
name = "moonblokz-vote"
version = "0.1.0"
edition = "2024"
description = "MoonBlokz no_std vote engine — reversible per-node accumulated-vote registry."
license = "MIT"
repository = "https://github.com/petersallai/moonblokz-vote"
keywords = ["embedded", "no-std", "blockchain", "moonblokz", "vote"]
categories = ["embedded", "no-std"]

[dependencies]
# Backend-agnostic: do NOT pin a crypto backend here. The selected Schnorr
# backend is chosen once at the top of the graph and forwarded down through the
# `[features]` table below (a consumer overrides via `default-features = false`
# + an alternate backend feature).
moonblokz-chain-types = { path = "../moonblokz-chain-types", default-features = false }

[features]
# Test oracle: enables the by-value `VoteEngine::new()` (the executable
# specification the in-place `init` is checked against) and a `PartialEq`
# derive for that comparison. Never enabled in production builds; downstream
# crates turn it on from their `[dev-dependencies]` only.
test-oracle = []
# The crypto backend is forwarded to `moonblokz-chain-types` (which forwards it
# on to `moonblokz-crypto`). Exactly one signature scheme must be active
# (DEC-246); the default is `schnorr`.
default = ["schnorr", "block-size-2016"]
block-size-2016 = ["moonblokz-chain-types/block-size-2016"]
block-size-65536 = ["moonblokz-chain-types/block-size-65536"]
schnorr = ["moonblokz-chain-types/schnorr"]
bls-min-sig = ["moonblokz-chain-types/bls-min-sig"]
bls-min-pk = ["moonblokz-chain-types/bls-min-pk"]

# Test-only: needed to sign `BlockBuilder::build_signed(...)` fixtures.
# Not linked into production builds — leaf-crate discipline holds on the
# `[dependencies]` set above.
[dev-dependencies]
# No scheme is pinned here: the crate's own scheme feature selects it through
# chain-types, so a matrix leg never enables two schemes.
moonblokz-crypto = { path = "../moonblokz-crypto-lib", default-features = false }


# Debug test runs build the curve code optimized (DEC-255): a BLS pairing in an
# unoptimized build is very slow. Only takes effect when this crate is the Cargo root.
[profile.dev.package.moonblokz-crypto]
opt-level = 3
[profile.dev.package.k256]
opt-level = 3
[profile.dev.package.primeorder]
opt-level = 3
[profile.dev.package.elliptic-curve]
opt-level = 3
[profile.dev.package.crypto-bigint]
opt-level = 3
[profile.dev.package.bls12_381]
opt-level = 3
[profile.dev.package.ff]
opt-level = 3
[profile.dev.package.group]
opt-level = 3
[profile.dev.package.pairing]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.subtle]
opt-level = 3
